[package]
name = "flutter_webrtc_rs_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"

# webrtc-rs: sans-I/O core (`rtc`) + async wrapper (`webrtc`). Pinned to the exact
# release tag we validated the API against (examples/ under git tag v0.21.0) - see
# rust/README.md. `webrtc`'s default features (runtime-tokio, crypto-ring) are what
# we want: a real Tokio runtime for ICE/DTLS UDP I/O and timers, ring for DTLS/SRTP
# crypto. Nothing here is platform-specific C/C++; this is why a single Rust build
# covers every Flutter target without per-platform native toolchains.
webrtc = "0.21.0"
rtc = "0.21.0"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
async-trait = "0.1"
bytes = "1"
log = "0.4"
serde_json = "1"
rand = "0.10"

# H264 encode/decode for video senders/receivers (see api/video_codec.rs). Builds
# openh264 from source by default (the "source" feature) via cc - no system
# library or extra toolchain beyond what cargo already needs, and no licensing
# gray area: Cisco's patent grant covers using openh264 as a *codec* regardless
# of how it's built, distinct from the separate (irrelevant here) precompiled-
# binary distribution some projects choose instead purely to skip a C build step.
openh264 = "0.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
