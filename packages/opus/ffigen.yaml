# Run with `dart run ffigen --config ffigen.yaml`.
#
# Bindings for libopus (third_party/opus, vendored as a git submodule) - just
# the plain encoder/decoder API (opus.h). Multistream/projection/custom
# modes aren't needed for basic voice chat and are left out.
name: OpusBindings
description: |
  Bindings for libopus's encoder/decoder API.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/src/opus_bindings_generated.dart'
headers:
  entry-points:
    - 'third_party/opus/include/opus.h'
  include-directives:
    - 'third_party/opus/include/opus.h'
ffi-native:
  asset-id: 'package:opus/opus'
comments:
  style: any
  length: full
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
